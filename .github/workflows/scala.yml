name: Scala CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"
        cache: sbt
    - uses: sbt/setup-sbt@v1

    - name: Run tests
      run: sbt client/test server/test

    - name: Generate artifact
      run: sbt client/fullOptJS

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: gow-client
        path: |
          gow-client/index.html
          gow-client/target/scala-2.13/gow-client-opt.js
          gow-client/target/scala-2.13/gow-client-opt.js.map
          gow-client/target/scala-2.13/classes/
          !gow-client/target/scala-2.13/classes/**/*.sjsir
        if-no-files-found: error
        retention-days: 30

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      DEPLOY_HOST: vps-f744b235.vps.ovh.net
      DEPLOY_HOST_KEY: "vps-f744b235.vps.ovh.net,54.37.66.50 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN4nymxNiHc8RKlZ/zSK7Wi3rHMnH5at3ZkdVvXM01tp"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"
        cache: sbt
    - uses: sbt/setup-sbt@v1

    - name: Configure SSH
      env:
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        echo "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts

    - name: Deploy
      run: deploy/deploy.sh "gow-deploy@$DEPLOY_HOST"

    - name: Smoke test
      run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null "https://$DEPLOY_HOST/"
