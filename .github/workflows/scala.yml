name: Scala CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11 and SBT
      uses: olafurpg/setup-scala@v14
      with:
        java-version: "adopt@1.11.0-11"  # ou "adopt@1.11.0-11" si nécessaire

    - name: Run tests
      run: sbt client/test server/test

    - name: Generate artifact
      run: sbt client/fullOptJS

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gow-client
        path: |
          gow-client/index.html
          gow-client/target/scala-2.13/gow-client-opt.js
          gow-client/target/scala-2.13/gow-client-opt.js.map
          gow-client/target/scala-2.13/classes/
          !gow-client/target/scala-2.13/classes/**/*.sjsir
        if-no-files-found: error
        retention-days: 30
